  --brand-border: #a7f3d0;

  --muted: #64748b;

* {

}

.brand-title {

}

.brand-icon {

  border: 1px solid rgba(255, 255, 255, 0.3);

  font-size: 14px;

}

.brand-text h1 {

}

.brand-text p {

.toolbar-controls {

.filter-group {

.filter-label {

.filter-select {

.filter-select-section {

}

.btn-action {

}

.btn-action svg {

}

.btn-print {

}

}

.btn-back {

}

.btn-back:hover {
  background: rgba(255, 255, 255, 0.25);
}

/* Printable Container (A4 / Legal Landscape) */
html, body {

}

.timetable-sheet {

  border-radius: 12px;

}

.timetable-sheet:last-child {

.timetable-sheet.is-fullscreen .timetable-grid tbody td {

.timetable-sheet.is-fullscreen .cell-time {

.timetable-sheet.is-fullscreen .cell-mins {

/* Responsive Table Scroll Wrapper */
.table-responsive-wrapper {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 0 0 8px 8px;
  border: 2px solid var(--brand-deep);
  border-top: none;
  background: #ffffff;
}

.table-responsive-wrapper::-webkit-scrollbar {
  height: 6px;
}

.table-responsive-wrapper::-webkit-scrollbar-track {
  background: #f1f5f9;
}

.table-responsive-wrapper::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 3px;
}

.table-responsive-wrapper::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

/* Timetable Table Grid */
.timetable-grid {
  width: 100%;
  min-width: 780px;
  border-collapse: collapse;
  border: none;

  background: #ffffff;
}

.timetable-grid thead th {
  background: var(--brand-green);
  color: #ffffff;
  font-size: 13px;

}

.timetable-grid thead th.col-mins {

}

.timetable-grid tbody td {
  border: 1.5px solid var(--line-strong);

  text-align: center;
  font-size: 12px;

}

.timetable-grid tbody td.cell-time {
  background: #f8fafc;
  font-weight: 800;
  color: #1e293b;
  font-size: 11.5px;

}

.timetable-grid tbody td.cell-mins {

  font-weight: 800;

/* Special Break Row */
.timetable-grid tbody tr.row-break td.cell-break {
  background: var(--break-bg) !important;
  color: var(--break-text) !important;
  font-size: 11.5px !important;
  font-weight: 900 !important;
  letter-spacing: 0.06em !important;
  text-transform: uppercase !important;
  text-align: center !important;
  padding: 6px 10px !important;
  height: 28px !important;
  border: 1.5px solid var(--break-border) !important;
}

/* Occupied Class Cell */
.timetable-grid tbody td.cell-class {
  font-weight: 850;
  line-height: 1.25;
}

.cell-class-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.cell-subject-sec {
  font-size: 11.5px;
  font-weight: 900;
  letter-spacing: -0.01em;
}

.cell-mod-badge {

  font-weight: 800;

  text-transform: uppercase;
}

/* Empty Cell */
.timetable-grid tbody td.cell-empty {

}

/* Footer / Legend Block */
.sheet-footer {
  margin-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;

.legend-strip {

.legend-box {

}

.legend-color-dot {

  height: 12px;
  border-radius: 3px;

<script>
(function() {
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
  let SECTIONS_DATA = [];

  const teacherSelect = document.getElementById('teacherSelect');
  const modalitySelect = document.getElementById('modalitySelect');
  const shiftGroup = document.getElementById('shiftGroup');
  const shiftSelect = document.getElementById('shiftSelect');
  const sectionSelect = document.getElementById('sectionSelect');
  const sheetsContainer = document.getElementById('sheetsContainer');
  let ALL_TEACHERS_DATA = window.AMIS_TEACHER_WEEKLY_SCHEDULES || {};

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatTime(t) {
    if (!t) return '-';
    let s = String(t).trim();
    s = s.replace(/a\.?m\.?/gi, 'AM').replace(/p\.?m\.?/gi, 'PM');
    return s;
  }

  function getSubjectColor(subj) {
    const s = (subj || "").toLowerCase();
    if (s.includes('gmrc') || s.includes('values') || s.includes('esp') || s.includes('homeroom') || s.includes('hg')) {
      return { bg: '#dcfce7', border: '#86efac', text: '#14532d' };
    }
    if (s.includes('arabic') || s.includes("qur'an") || s.includes('quran') || s.includes('hadith') || s.includes('shaf') || s.includes('islamic')) {
      return { bg: '#f3e8ff', border: '#d8b4fe', text: '#581c87' };
    }
    if (s.includes('math') || s.includes('calculus') || s.includes('statistics') || s.includes('algebra')) {
      return { bg: '#e0f2fe', border: '#7dd3fc', text: '#0369a1' };
    }
    if (s.includes('science') || s.includes('sci') || s.includes('biology') || s.includes('chemistry') || s.includes('physics') || s.includes('earth')) {
      return { bg: '#ccfbf1', border: '#5eead4', text: '#115e59' };
    }
    if (s.includes('english') || s.includes('reading') || s.includes('oral') || s.includes('literature') || s.includes('eapp') || s.includes('circle') || s.includes('meeting') || s.includes('wrap-up')) {
      return { bg: '#fef3c7', border: '#fde047', text: '#854d0e' };
    }
    if (s.includes('filipino') || s.includes('makabansa') || s.includes('ap') || s.includes('soc.sci') || s.includes('philo') || s.includes('kompan') || s.includes('ucsp')) {
      return { bg: '#ffedd5', border: '#fdba74', text: '#9a3412' };
    }
    if (s.includes('mapeh') || s.includes('tle') || s.includes('pe') || s.includes('entrep') || s.includes('e-tech') || s.includes('cpar') || s.includes('mil')) {
      return { bg: '#fae8ff', border: '#f0abfc', text: '#86198f' };
    }
    return { bg: '#f1f5f9', border: '#cbd5e1', text: '#1e293b' };
  }

  async function init() {
    try {
      const resp = await fetch('class_schedules_data.json?v=' + Date.now());
      if (resp.ok) {
        SECTIONS_DATA = await resp.json();
      } else if (window.CLASS_SCHEDULES_DATA) {
        SECTIONS_DATA = window.CLASS_SCHEDULES_DATA;
      }
    } catch (e) {
      if (window.CLASS_SCHEDULES_DATA) SECTIONS_DATA = window.CLASS_SCHEDULES_DATA;
    }

    try {
      const tResp = await fetch('teacher_weekly_schedules.json?v=' + Date.now());
      if (tResp.ok) {
        ALL_TEACHERS_DATA = await tResp.json();
      } else if (window.AMIS_TEACHER_WEEKLY_SCHEDULES) {
        ALL_TEACHERS_DATA = window.AMIS_TEACHER_WEEKLY_SCHEDULES;
      }
    } catch (e) {
      if (window.AMIS_TEACHER_WEEKLY_SCHEDULES) ALL_TEACHERS_DATA = window.AMIS_TEACHER_WEEKLY_SCHEDULES;
    }

    if (!SECTIONS_DATA || SECTIONS_DATA.length === 0) {
      sheetsContainer.innerHTML = '<div style="text-align:center; padding:50px; color:#64748b;">No class schedule data available.</div>';
      return;
    }

    populateTeacherDropdown();

    const urlParams = new URLSearchParams(window.location.search);
    let initTeacher = urlParams.get('teacher') || '';
    let initModality = urlParams.get('modality') || 'F2F';
    let initShift = urlParams.get('shift') || 'ODL1';
    let initSec = urlParams.get('section') || 'ALL_GROUP';

    if (initTeacher && (ALL_TEACHERS_DATA[initTeacher] || initTeacher === 'ALL_FACULTY')) {
      teacherSelect.value = initTeacher;
    } else {
      modalitySelect.value = ['F2F', 'ODL', 'ALL'].includes(initModality.toUpperCase()) ? initModality.toUpperCase() : 'F2F';
      shiftSelect.value = ['ODL1', 'ODL2', 'ODL_ALL'].includes(initShift.toUpperCase()) ? initShift.toUpperCase() : 'ODL1';
    }

    updateShiftVisibility();
    populateSectionDropdown();

    if (initSec && !initTeacher) {
      sectionSelect.value = initSec;
      if (!sectionSelect.value) sectionSelect.selectedIndex = 0;
    }

    renderCurrentView();

    teacherSelect.addEventListener('change', () => {
      renderCurrentView();
    });

    modalitySelect.addEventListener('change', () => {
      teacherSelect.value = '';
      updateShiftVisibility();
      populateSectionDropdown();
      renderCurrentView();
    });

    shiftSelect.addEventListener('change', () => {
      teacherSelect.value = '';
      populateSectionDropdown();
      renderCurrentView();
    });

    sectionSelect.addEventListener('change', () => {
      teacherSelect.value = '';
      renderCurrentView();
    });
  }

  function populateTeacherDropdown() {
    let teachers = Object.values(ALL_TEACHERS_DATA || {}).filter(t => ((t.periods && t.periods.length) || t.total_classes || t.total_teaching_periods || 0) > 0);
    teachers = teachers.sort((a, b) => (a.canonical_name || a.teacher_name).localeCompare(b.canonical_name || b.teacher_name));

    let html = '<option value="">All Staff / Faculty</option>';
    html += '<option value="ALL_FACULTY">[ALL FACULTY] Show All Faculty Timetables</option>';
    teachers.forEach(t => {
      const name = t.canonical_name || t.teacher_name;
      const count = (t.periods ? t.periods.length : 0) || t.total_classes || t.total_teaching_periods || 0;
      const countLabel = count ? ` (${count} classes)` : '';
      html += `<option value="${t.teacher_id}">${esc(name)}${countLabel}</option>`;
    });
    teacherSelect.innerHTML = html;
  }

  function updateShiftVisibility() {
    if (modalitySelect.value === 'ODL') {
      shiftGroup.style.display = 'flex';
    } else {
      shiftGroup.style.display = 'none';
    }
  }

  function getFilteredPool() {
    const mod = modalitySelect.value;
    const shift = shiftSelect.value;

    if (mod === 'F2F') {
      return SECTIONS_DATA.filter(s => s.shift === 'F2F');
    } else if (mod === 'ODL') {
      if (shift === 'ODL1') {
        return SECTIONS_DATA.filter(s => s.shift === 'ODL - 1ST SHIFT');
      } else if (shift === 'ODL2') {
        return SECTIONS_DATA.filter(s => s.shift === 'ODL - 2ND SHIFT');
      } else {
        return SECTIONS_DATA.filter(s => s.shift.includes('ODL'));
      }
    } else {
      return SECTIONS_DATA;
    }
  }

  function populateSectionDropdown() {
    const pool = getFilteredPool();
    const mod = modalitySelect.value;
    const shift = shiftSelect.value;

    let groupTitle = "All Sections";
    if (mod === 'F2F') groupTitle = `[ALL F2F] Show All ${pool.length} F2F Classes`;
    else if (mod === 'ODL') {
      if (shift === 'ODL1') groupTitle = `[ALL 1ST SHIFT] Show All ${pool.length} Classes`;
      else if (shift === 'ODL2') groupTitle = `[ALL 2ND SHIFT] Show All ${pool.length} Classes`;
      else groupTitle = `[ALL ODL] Show All ${pool.length} ODL Classes`;
    } else {
      groupTitle = `[ALL SECTIONS] Show All ${pool.length} Classes`;
    }

    let html = `<option value="ALL_GROUP">${groupTitle}</option>`;

    pool.forEach(s => {
      const globalIdx = SECTIONS_DATA.indexOf(s);
      html += `<option value="${globalIdx}">${esc(s.section_name)}</option>`;
    });

    sectionSelect.innerHTML = html;
    sectionSelect.value = "ALL_GROUP";
  }

  function renderCurrentView() {
    const tVal = teacherSelect.value;
    if (tVal) {
      if (tVal === 'ALL_FACULTY') {
        const teacherIds = Object.values(ALL_TEACHERS_DATA)
          .sort((a, b) => (a.canonical_name || a.teacher_name).localeCompare(b.canonical_name || b.teacher_name))
          .map(t => t.teacher_id);
        renderMultipleTeacherSheets(teacherIds);
      } else if (ALL_TEACHERS_DATA[tVal]) {
        renderMultipleTeacherSheets([tVal]);
      }
      return;
    }

    const secVal = sectionSelect.value;
    const pool = getFilteredPool();

    if (secVal === 'ALL_GROUP') {
      renderMultipleSections(pool);
    } else {
      const targetSec = SECTIONS_DATA[parseInt(secVal, 10)];
      if (targetSec) {
        renderMultipleSections([targetSec]);
      } else {
        renderMultipleSections(pool);
      }
    }
  }

  function renderMultipleTeacherSheets(tIds) {
    const todayStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    let fullHtml = '';

    tIds.forEach(tid => {
      const data = ALL_TEACHERS_DATA[tid];
      if (!data) return;

      const teacherDisplayName = data.canonical_name || data.teacher_name || tid;
      const totalCount = data.total_classes || data.total_teaching_periods || (data.rows ? data.rows.reduce((acc, r) => acc + Object.values(r.days || {}).filter(c => c && (c.occupied || c.is_class)).length, 0) : 0);
      const metaStr = `${totalCount} Teaching Period${totalCount === 1 ? '' : 's'}`;

      fullHtml += `
        <div class="timetable-sheet">
          <div class="school-header" style="display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;">
            <img src="amis_logo.png" alt="AMIS Logo" style="width:48px; height:48px; border-radius:50%; object-fit:contain;">
            <div>
              <h1 style="margin:0;">AL MUNAWWARA ISLAMIC SCHOOL</h1>
              <h2 style="margin:2px 0 0 0;">Faculty Timetable — Class Schedule</h2>
              <p style="margin:2px 0 0 0;">Official Weekly Schedule S.Y. 2026–2027</p>
            </div>
          </div>

          <div class="teacher-banner">
            <span class="teacher-name-title">${esc(teacherDisplayName.toUpperCase())}</span>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="teacher-meta-tag">${esc(metaStr)}</span>
              <button class="btn-fullscreen" onclick="toggleFullscreenSheet(this)" title="Fullscreen Table" aria-label="Toggle Fullscreen">
                <svg class="icon-expand" viewBox="0 0 24 24" style="display:inline-block;"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                <svg class="icon-compress" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
              </button>
            </div>
          </div>

          <div class="table-responsive-wrapper">
            <table class="timetable-grid">
              <thead>
                <tr>
                  <th class="col-time">Time</th>
                  <th class="col-mins">Minutes</th>
                  <th>Sunday</th>
                  <th>Monday</th>
                  <th>Tuesday</th>
                  <th>Wednesday</th>
                  <th>Thursday</th>
                </tr>
              </thead>
              <tbody>
        `;

        const rows = data.rows || [];
        if (rows.length === 0) {
          fullHtml += `
            <tr>
              <td colspan="7" style="padding: 30px; text-align: center; color: #64748b; font-weight: 700; font-size: 13px;">
                No active weekly class periods scheduled for ${esc(teacherDisplayName)}.
              </td>
            </tr>
          `;
        } else {
          rows.forEach(r => {
            const minsStr = typeof r.minutes === 'number' ? `${r.minutes} min.` : (r.minutes || '-');
            const timeFormatted = esc(r.time);

            if (r.is_break) {
              fullHtml += `
                <tr class="row-break">
                  <td class="cell-time">${timeFormatted}</td>
                  <td class="cell-mins">${esc(minsStr)}</td>
                  <td colspan="5" class="cell-break">${esc(r.break_title || r.label || 'BREAK')}</td>
                </tr>
              `;
            } else {
              fullHtml += `
                <tr>
                  <td class="cell-time">${timeFormatted}</td>
                  <td class="cell-mins">${esc(minsStr)}</td>
              `;

              for (const d of DAYS) {
                const cell = r.days ? r.days[d] : null;
                if (cell && (cell.occupied || cell.is_class)) {
                  const color = cell.color || { bg: cell.bg || '#f1f5f9', border: cell.border || '#cbd5e1', text: cell.text || '#1e293b' };
                  const modTag = cell.modality || cell.shift || '';

                  fullHtml += `
                    <td class="cell-class" style="background:${color.bg}; border-color:${color.border}; color:${color.text};">
                      <div class="cell-class-inner">
                        ${cell.has_conflict ? `<span style="background:#fee2e2; color:#991b1b; padding:1px 4px; border-radius:3px; font-weight:850; font-size:8.5px; margin-bottom:2px; text-transform:uppercase;">⚠️ SCHEDULE CONFLICT</span>` : ''}
                        <span class="cell-subject-sec" style="font-weight:900; font-size:12px; line-height:1.2;">${esc(cell.subject || cell.label)}</span>
                        <span class="cell-mod-badge" style="color:${color.text}; font-weight:750; font-size:10px; opacity:0.95; line-height:1.15;">${esc(cell.section_short || cell.section || '')}${modTag ? ' • ' + esc(modTag) : ''}</span>
                      </div>
                    </td>
                  `;
                } else {
                  fullHtml += `<td class="cell-empty"></td>`;
                }
              }

              fullHtml += `</tr>`;
            }
          });
        }

        fullHtml += `
              </tbody>
            </table>
          </div>

          <div class="sheet-footer">
            <div class="legend-strip">
              <span style="font-weight: 800; color: var(--ink);">Subject Keys:</span>
              <div class="legend-box"><span class="legend-color-dot" style="background:#f3e8ff; border-color:#d8b4fe;"></span> Arabic / Qur'an / Islamic</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#dcfce7; border-color:#86efac;"></span> GMRC / Values / ESP</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#e0f2fe; border-color:#7dd3fc;"></span> Mathematics</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#ccfbf1; border-color:#5eead4;"></span> Science</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#fef3c7; border-color:#fde047;"></span> English / Language</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#ffedd5; border-color:#fdba74;"></span> Filipino / AP / Makabansa</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#fae8ff; border-color:#f0abfc;"></span> MAPEH / TLE / TVL</div>
            </div>
            <div>
              Generated: <strong>${todayStr}</strong>
            </div>
          </div>
        </div>
      `;
    });

    sheetsContainer.innerHTML = fullHtml;
  }

  function renderMultipleSections(list) {
    const todayStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    let fullHtml = '';

    if (!list || list.length === 0) {
      sheetsContainer.innerHTML = '<div style="text-align:center; padding:50px; color:#64748b; font-weight:700;">No section schedules found for this selection.</div>';
      return;
    }

    list.forEach(sec => {
      fullHtml += `
        <div class="timetable-sheet">
          <div class="school-header" style="display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;">
            <img src="amis_logo.png" alt="AMIS Logo" style="width:48px; height:48px; border-radius:50%; object-fit:contain;">
            <div>
              <h1 style="margin:0;">AL MUNAWWARA ISLAMIC SCHOOL</h1>
              <h2 style="margin:2px 0 0 0;">Official Class Timetable / Section Weekly Schedule</h2>
              <p style="margin:2px 0 0 0;">School Year 2026–2027</p>
            </div>
          </div>

          <div class="teacher-banner">
            <span class="teacher-name-title">${esc(sec.section_name.toUpperCase())}</span>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="teacher-meta-tag">${esc(sec.department)} • ${esc(sec.grade_level)} • ${esc(sec.shift)}</span>
              <button class="btn-fullscreen" onclick="toggleFullscreenSheet(this)" title="Fullscreen Table" aria-label="Toggle Fullscreen">
                <svg class="icon-expand" viewBox="0 0 24 24" style="display:inline-block;"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                <svg class="icon-compress" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
              </button>
            </div>
          </div>

          <div class="table-responsive-wrapper">
            <table class="timetable-grid">
              <thead>
                <tr>
                  <th class="col-time">Time</th>
                  <th class="col-mins">Minutes</th>
                  <th>Sunday</th>
                  <th>Monday</th>
                  <th>Tuesday</th>
                  <th>Wednesday</th>
                  <th>Thursday</th>
                </tr>
              </thead>
              <tbody>
        `;

        sec.periods.forEach(p => {
          const timeStr = formatTime(p.time);

          if (p.is_merged_all_days) {
            if (p.is_break) {
              fullHtml += `
                <tr class="row-break">
                  <td class="cell-time">${esc(timeStr)}</td>
                  <td class="cell-mins">${esc(p.minutes)}</td>
                  <td colspan="5" class="cell-break">${esc(p.label || p.subject || 'BREAK / ASSEMBLY')}</td>
                </tr>
              `;
            } else {
              const color = getSubjectColor(p.subject || p.label);
              fullHtml += `
                <tr>
                  <td class="cell-time">${esc(timeStr)}</td>
                  <td class="cell-mins">${esc(p.minutes)}</td>
                  <td colspan="5" class="cell-class" style="background:${color.bg}; border-color:${color.border}; color:${color.text}; text-align:center;">
                    <div class="cell-class-inner">
                      <span class="cell-subject-sec">${esc(p.subject || p.label)}</span>
                      ${p.teacher ? `<span class="cell-mod-badge" style="color:${color.text}; font-weight:800;">${esc(p.teacher)}</span>` : ''}
                    </div>
                  </td>
                </tr>
              `;
            }
          } else {
            const firstDay = p.days ? p.days['Sunday'] : null;
            const isBreakRow = firstDay && firstDay.is_break;

            if (isBreakRow) {
              fullHtml += `
                <tr class="row-break">
                  <td class="cell-time">${esc(timeStr)}</td>
                  <td class="cell-mins">${esc(p.minutes)}</td>
                  <td colspan="5" class="cell-break">${esc(firstDay.label || 'BREAK / ASSEMBLY')}</td>
                </tr>
              `;
            } else {
              fullHtml += `
                <tr>
                  <td class="cell-time">${esc(timeStr)}</td>
                  <td class="cell-mins">${esc(p.minutes)}</td>
              `;

              DAYS.forEach(d => {
                const cell = p.days ? p.days[d] : null;
                if (!cell) {
                  fullHtml += `<td class="cell-empty"></td>`;
                } else if (cell.is_break) {
                  fullHtml += `<td class="cell-break" style="font-size:11px; font-weight:800; color:#64748b; background:#f1f5f9;">${esc(cell.label)}</td>`;
                } else {
                  const color = getSubjectColor(cell.subject);
                  fullHtml += `
                    <td class="cell-class" style="background:${color.bg}; border-color:${color.border}; color:${color.text};">
                      <div class="cell-class-inner">
                        <span class="cell-subject-sec">${esc(cell.subject)}</span>
                        ${cell.teacher ? `<span class="cell-mod-badge" style="color:${color.text}; font-weight:800;">${esc(cell.teacher)}</span>` : ''}
                      </div>
                    </td>
                  `;
                }
              });

              fullHtml += `</tr>`;
            }
          }
        });

        fullHtml += `
              </tbody>
            </table>
          </div>

          <div class="sheet-footer">
            <div class="legend-strip">
              <span style="font-weight: 800; color: var(--ink);">Subject Keys:</span>
              <div class="legend-box"><span class="legend-color-dot" style="background:#f3e8ff; border-color:#d8b4fe;"></span> Arabic / Qur'an / Islamic</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#dcfce7; border-color:#86efac;"></span> GMRC / Values / ESP</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#e0f2fe; border-color:#7dd3fc;"></span> Math / Physics</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#ccfbf1; border-color:#5eead4;"></span> Science / Biology</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#fef3c7; border-color:#fde047;"></span> English / Reading</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#ffedd5; border-color:#fdba74;"></span> AP / Social / Filipino</div>
              <div class="legend-box"><span class="legend-color-dot" style="background:#fae8ff; border-color:#f0abfc;"></span> MAPEH / TLE</div>
            </div>
            <div>
              <span>Al Munawwara Islamic School • Generated on <strong>${todayStr}</strong></span>
            </div>
          </div>
        </div>
      `;
    });

    sheetsContainer.innerHTML = fullHtml;
  }

  window.toggleFullscreenSheet = function(btn) {
    const sheet = btn.closest('.timetable-sheet');
    if (!sheet) return;

    const isFs = sheet.classList.toggle('is-fullscreen');
    const iconExpand = btn.querySelector('.icon-expand');
    const iconCompress = btn.querySelector('.icon-compress');

    if (isFs) {
      if (iconExpand) iconExpand.style.display = 'none';
      if (iconCompress) iconCompress.style.display = 'inline-block';
      btn.setAttribute('title', 'Exit Fullscreen');
      if (sheet.requestFullscreen && !document.fullscreenElement) {
        sheet.requestFullscreen().catch(() => {});
      }
    } else {
      if (iconExpand) iconExpand.style.display = 'inline-block';
      if (iconCompress) iconCompress.style.display = 'none';
      btn.setAttribute('title', 'Fullscreen Table');
      if (document.exitFullscreen && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }
  };

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      document.querySelectorAll('.timetable-sheet.is-fullscreen').forEach(sh => {
        sh.classList.remove('is-fullscreen');
        const btn = sh.querySelector('.btn-fullscreen');
        if (btn) {
          const iconExpand = btn.querySelector('.icon-expand');
          const iconCompress = btn.querySelector('.icon-compress');
          if (iconExpand) iconExpand.style.display = 'inline-block';
          if (iconCompress) iconCompress.style.display = 'none';
          btn.setAttribute('title', 'Fullscreen Table');
        }
      });
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
