<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMIS — Faculty Timetable & Teacher Weekly Schedule</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- html2pdf.js CDN with offline fallback -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- Embedded Master Weekly Data -->
<script src="teacher_weekly_schedules.js"></script>

<style>
:root {
  --brand-deep: #064e3b;
  --brand-green: #0b4d38;
  --brand-accent: #0f766e;
  --brand-surface: #f0fdf4;
  --brand-border: #a7f3d0;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --muted: #64748b;
  --line: #cbd5e1;
  --line-strong: #94a3b8;
  --bg: #f8fafc;
  --surface: #ffffff;
  
  --break-bg: #f1f5f9;
  --break-text: #475569;
  --break-border: #cbd5e1;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

/* Screen Navigation Toolbar */
.top-toolbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: var(--brand-deep);
  color: #fff;
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 38px;
  height: 38px;
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 16px;
}

.brand-text h1 {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.brand-text p {
  font-size: 12px;
  color: #a7f3d0;
  font-weight: 600;
}

.toolbar-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.select-teacher {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  background: #ffffff;
  color: var(--ink);
  font-weight: 700;
  font-size: 13.5px;
  outline: none;
  cursor: pointer;
  min-width: 260px;
}

.btn-action {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 800;
  cursor: pointer;
  border: 1.5px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  transition: all 0.15s ease;
}

.btn-print {
  background: #ffffff;
  color: var(--brand-deep);
  border-color: #ffffff;
}

.btn-print:hover {
  background: #f0fdf4;
}

.btn-pdf {
  background: #f59e0b;
  color: #ffffff;
}

.btn-pdf:hover {
  background: #d97706;
}

.btn-back {
  background: rgba(255, 255, 255, 0.15);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.25);
}

.btn-back:hover {
  background: rgba(255, 255, 255, 0.25);
}

/* Printable Container (A4 / Legal Landscape) */
.page-sheet-container {
  max-width: 1400px;
  margin: 24px auto 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.timetable-sheet {
  background: #ffffff;
  border: 2px solid var(--line-strong);
  border-radius: 12px;
  padding: 24px 28px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  page-break-after: always;
  break-after: page;
}

.timetable-sheet:last-child {
  page-break-after: auto;
  break-after: auto;
}

/* Header Block */
.school-header {
  text-align: center;
  margin-bottom: 14px;
}

.school-header h1 {
  font-size: 20px;
  font-weight: 900;
  color: var(--brand-deep);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.school-header h2 {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink-secondary);
  letter-spacing: 0.02em;
  margin-top: 2px;
}

.school-header p {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 1px;
}

/* Teacher Banner */
.teacher-banner {
  background: var(--brand-deep);
  color: #ffffff;
  padding: 10px 16px;
  border-radius: 8px 8px 0 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 2px solid var(--brand-deep);
  border-bottom: 0;
}

.teacher-name-title {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.teacher-meta-tag {
  font-size: 12px;
  font-weight: 800;
  background: rgba(255, 255, 255, 0.2);
  padding: 4px 10px;
  border-radius: 6px;
  letter-spacing: 0.02em;
}

/* Timetable Table Grid */
.timetable-grid {
  width: 100%;
  border-collapse: collapse;
  border: 2px solid var(--brand-deep);
  table-layout: fixed;
  background: #ffffff;
}

.timetable-grid thead th {
  background: var(--brand-green);
  color: #ffffff;
  font-size: 13px;
  font-weight: 800;
  text-align: center;
  padding: 8px 6px;
  border: 1.5px solid #043828;
  letter-spacing: 0.02em;
}

.timetable-grid thead th.col-time {
  width: 135px;
}

.timetable-grid thead th.col-mins {
  width: 70px;
}

.timetable-grid tbody td {
  border: 1.5px solid var(--line-strong);
  padding: 5px 6px;
  text-align: center;
  font-size: 12px;
  vertical-align: middle;
  height: 38px;
}

.timetable-grid tbody td.cell-time {
  background: #f8fafc;
  font-weight: 800;
  color: #1e293b;
  font-size: 11.5px;
  white-space: nowrap;
}

.timetable-grid tbody td.cell-mins {
  background: #f1f5f9;
  font-weight: 800;
  color: #475569;
  font-size: 12px;
}

/* Special Break Row */
.timetable-grid tbody tr.row-break td.cell-break {
  background: var(--break-bg) !important;
  color: var(--break-text) !important;
  font-size: 11px !important;
  font-weight: 900 !important;
  letter-spacing: 0.06em !important;
  text-transform: uppercase !important;
  text-align: center !important;
  padding: 5px 10px !important;
  height: 26px !important;
  border: 1.5px solid var(--break-border) !important;
}

/* Occupied Class Cell */
.timetable-grid tbody td.cell-class {
  font-weight: 850;
  line-height: 1.25;
  transition: transform 0.1s ease;
}

.cell-class-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}

.cell-subject-sec {
  font-size: 11.5px;
  font-weight: 900;
  letter-spacing: -0.01em;
}

.cell-mod-badge {
  font-size: 9.5px;
  font-weight: 700;
  opacity: 0.85;
  text-transform: uppercase;
}

/* Empty Cell */
.timetable-grid tbody td.cell-empty {
  background: #ffffff;
}

/* Footer / Legend Block */
.sheet-footer {
  margin-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  border-top: 1.5px solid var(--line);
  padding-top: 10px;
}

.legend-strip {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.legend-box {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.legend-color-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  border: 1px solid rgba(0, 0, 0, 0.2);
}

/* Print Specific Rules */
@media print {
  @page {
    size: A4 landscape;
    margin: 6mm 6mm;
  }

  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    width: 100% !important;
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .top-toolbar {
    display: none !important;
    height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .page-sheet-container {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    gap: 0 !important;
  }

  .timetable-sheet {
    display: block !important;
    width: 100% !important;
    border: none !important;
    box-shadow: none !important;
    margin: 0 !important;
    padding: 0 !important;
    page-break-inside: avoid !important;
    break-inside: avoid !important;
    page-break-after: auto !important;
    break-after: auto !important;
  }

  .timetable-sheet:not(:last-child) {
    page-break-after: always !important;
    break-after: page !important;
  }

  .school-header {
    margin-bottom: 6px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 10px !important;
  }

  .school-header img {
    width: 38px !important;
    height: 38px !important;
  }

  .school-header h1 {
    font-size: 15px !important;
    font-weight: 900 !important;
    margin: 0 !important;
    line-height: 1.1 !important;
  }

  .school-header h2 {
    font-size: 11px !important;
    margin: 1px 0 0 0 !important;
    line-height: 1.1 !important;
  }

  .school-header p {
    font-size: 9.5px !important;
    margin: 1px 0 0 0 !important;
    line-height: 1.1 !important;
  }

  .teacher-banner {
    padding: 4px 10px !important;
    border-radius: 4px 4px 0 0 !important;
    margin-bottom: 0 !important;
  }

  .teacher-name-title {
    font-size: 12px !important;
    font-weight: 900 !important;
  }

  .teacher-meta-tag {
    font-size: 10px !important;
    font-weight: 700 !important;
  }

  .timetable-grid {
    width: 100% !important;
    border-collapse: collapse !important;
    table-layout: fixed !important;
    page-break-inside: avoid !important;
    break-inside: avoid !important;
  }

  .timetable-grid thead th {
    padding: 3px 4px !important;
    font-size: 10px !important;
    height: 20px !important;
    font-weight: 800 !important;
  }

  .timetable-grid tbody td {
    height: 22px !important;
    padding: 2px 3px !important;
    font-size: 9px !important;
    line-height: 1.15 !important;
  }

  .col-time, .cell-time {
    width: 110px !important;
    font-size: 9px !important;
    font-weight: 700 !important;
  }

  .col-mins, .cell-mins {
    width: 44px !important;
    font-size: 8.5px !important;
  }

  .cell-subject-sec {
    font-size: 9px !important;
    font-weight: 700 !important;
  }

  .cell-mod-badge {
    font-size: 7.5px !important;
    padding: 1px 3px !important;
  }

  .cell-break {
    font-size: 8.5px !important;
    font-weight: 700 !important;
    letter-spacing: 0.04em !important;
  }
}
</style>
</head>
<body>

<!-- Top Navigation Toolbar -->
<header class="top-toolbar">
  <div class="brand-title">
    <img src="amis_logo.png" alt="AMIS Logo" style="width:38px; height:38px; border-radius:50%; object-fit:contain; background:#ffffff; padding:1px; box-shadow:0 2px 6px rgba(0,0,0,0.2);">
    <div class="brand-text">
      <h1>Faculty Timetable / Teacher Weekly Schedule</h1>
      <p>Print & Landscape PDF Generator • S.Y. 2026–2027</p>
    </div>
  </div>

  <div class="toolbar-controls">
    <select id="teacherSelect" class="select-teacher" aria-label="Select Faculty Member">
      <option value="">Loading faculty members...</option>
    </select>

    <button id="btnPrint" class="btn-action btn-print" onclick="window.print()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18 3H6V7H18V3M19 12A1 1 0 1 1 18 11A1 1 0 0 1 19 12M16 19H8V14H16V19M19 8H5A3 3 0 0 0 2 11V17H6V21H18V17H22V11A3 3 0 0 0 19 8Z"/></svg>
      Print Schedule
    </button>
    <a href="index.html" class="btn-action btn-back" style="background:#ffffff; color:#0f172a; border-color:#cbd5e1; font-weight:700;" title="Back to Schedule Home">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Schedule Home
    </a>
    <a href="class-schedule.html" class="btn-action" style="background:#0f766e; color:#fff; border-color:#0f766e;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/></svg>
      Class Schedule
    </a>
    <a href="exam-schedule.html" class="btn-action btn-back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V8H19M16 1V3H8V1H6V3H5C3.89 3 3 3.89 3 5V19A2 2 0 0 0 5 21H19A2 2 0 0 0 21 19V5C21 3.89 20.1 3 19 3H18V1M17 12H12V17H17V12Z"/></svg>
      Exam Schedule
    </a>
    <a href="teacher-tracking.html" class="btn-action btn-back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z"/></svg>
      Teacher Tracking
    </a>
  </div>
</header>

<!-- Main Printable Landscape Sheet -->
<main class="page-sheet-container" id="sheetsContainer">
  <!-- Dynamic Faculty Sheets rendered here -->
</main>

<script>
(function() {
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
  let ALL_TEACHERS_DATA = {};
  let currentTeacherId = "tchr_silfah";

  const teacherSelect = document.getElementById('teacherSelect');
  const sheetsContainer = document.getElementById('sheetsContainer');

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function loadData() {
    if (window.AMIS_TEACHER_WEEKLY_SCHEDULES) {
      ALL_TEACHERS_DATA = window.AMIS_TEACHER_WEEKLY_SCHEDULES;
    } else {
      try {
        const resp = await fetch('teacher_weekly_schedules.json?v=' + Date.now());
        if (resp.ok) {
          ALL_TEACHERS_DATA = await resp.json();
        }
      } catch (e) {
        console.warn('Failed to load JSON:', e);
      }
    }

    const teacherList = Object.values(ALL_TEACHERS_DATA).sort((a, b) => (a.canonical_name || a.teacher_name).localeCompare(b.canonical_name || b.teacher_name));
    if (teacherList.length === 0) {
      sheetsContainer.innerHTML = '<div style="text-align:center; padding:50px; color:#64748b;">No schedule data available.</div>';
      return;
    }

    // Populate Select Box with Unique Canonical Teachers
    let selectHtml = `<option value="ALL_FACULTY">[ALL FACULTY] Show & Print All ${teacherList.length} Teachers</option><optgroup label="── Unique Faculty Members ──">`;
    selectHtml += teacherList.map(t => `<option value="${esc(t.teacher_id)}">${esc(t.canonical_name || t.teacher_name)}</option>`).join('');
    selectHtml += `</optgroup>`;
    teacherSelect.innerHTML = selectHtml;

    // Check URL Param ?teacher=...
    const urlParams = new URLSearchParams(window.location.search);
    const paramTeacher = urlParams.get('teacher');
    if (paramTeacher && ['all', 'all_faculty'].includes(paramTeacher.toLowerCase())) {
      currentTeacherId = "ALL_FACULTY";
    } else if (paramTeacher && ALL_TEACHERS_DATA[paramTeacher]) {
      currentTeacherId = paramTeacher;
    } else if (paramTeacher) {
      const pLow = paramTeacher.toLowerCase().replace(/[^a-z0-9]/g, '');
      const match = teacherList.find(t => {
        const cLow = (t.canonical_name || t.teacher_name).toLowerCase().replace(/[^a-z0-9]/g, '');
        const idLow = t.teacher_id.toLowerCase().replace(/[^a-z0-9]/g, '');
        return cLow === pLow || idLow === pLow || cLow.includes(pLow) || pLow.includes(cLow);
      });
      if (match) currentTeacherId = match.teacher_id;
    }

    if (!ALL_TEACHERS_DATA[currentTeacherId] && currentTeacherId !== "ALL_FACULTY") {
      currentTeacherId = teacherList[0].teacher_id;
    }

    teacherSelect.value = currentTeacherId;
    renderSelectedTeachers(currentTeacherId);

    teacherSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      currentTeacherId = val;
      const newUrl = new URL(window.location);
      if (val === 'ALL_FACULTY') newUrl.searchParams.set('teacher', 'all');
      else newUrl.searchParams.set('teacher', currentTeacherId);
      window.history.replaceState({}, '', newUrl);
      renderSelectedTeachers(currentTeacherId);
    });
  }

  function renderSelectedTeachers(val) {
    if (val === 'ALL_FACULTY') {
      const teacherIds = Object.values(ALL_TEACHERS_DATA)
        .sort((a, b) => (a.canonical_name || a.teacher_name).localeCompare(b.canonical_name || b.teacher_name))
        .map(t => t.teacher_id);
      renderMultipleTeacherSheets(teacherIds);
    } else {
      if (ALL_TEACHERS_DATA[val]) {
        renderMultipleTeacherSheets([val]);
      }
    }
  }

  function renderMultipleTeacherSheets(tIds) {
    const todayStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    let fullHtml = '';

    tIds.forEach(tid => {
      const data = ALL_TEACHERS_DATA[tid];
      if (!data) return;

      const teacherDisplayName = data.canonical_name || data.teacher_name || tid;
      const totalCount = data.total_classes || data.total_teaching_periods || (data.rows ? data.rows.reduce((acc, r) => acc + Object.values(r.days || {}).filter(c => c && (c.occupied || c.is_class)).length, 0) : 0);
      const subjsList = (data.subjects && data.subjects.length > 0) ? data.subjects.join(', ') : 'Assigned Classes';
      const metaStr = `${totalCount} Teaching Period${totalCount === 1 ? '' : 's'} • ${subjsList}`;

      fullHtml += `
        <div class="timetable-sheet">
          <div class="school-header" style="display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;">
            <img src="amis_logo.png" alt="AMIS Logo" style="width:48px; height:48px; border-radius:50%; object-fit:contain;">
            <div>
              <h1 style="margin:0;">AL MUNAWWARA ISLAMIC SCHOOL</h1>
              <h2 style="margin:2px 0 0 0;">Faculty Timetable / Teacher Weekly Schedule</h2>
              <p style="margin:2px 0 0 0;">School Year 2026–2027 • Developed by Software Engineer Mon Zhairel Lingasa</p>
            </div>
          </div>

          <div class="teacher-banner">
            <span class="teacher-name-title">${esc(teacherDisplayName.toUpperCase())}</span>
            <span class="teacher-meta-tag">${esc(metaStr)}</span>
          </div>

          <table class="timetable-grid">
            <thead>
              <tr>
                <th class="col-time">Time</th>
                <th class="col-mins">Minutes</th>
                <th>Sunday</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
              </tr>
            </thead>
            <tbody>
      `;

      const rows = data.rows || [];
      rows.forEach(r => {
        const minsStr = typeof r.minutes === 'number' ? `${r.minutes} min.` : (r.minutes || '-');
        const timeFormatted = esc(r.time).replace(/\n/g, '<br><span style="font-size:10px; color:#475569; font-weight:600;">') + (r.time.includes('\n') ? '</span>' : '');

        if (r.is_break) {
          fullHtml += `
            <tr class="row-break">
              <td class="cell-time">${timeFormatted}</td>
              <td class="cell-mins">${esc(minsStr)}</td>
              <td colspan="5" class="cell-break">${esc(r.break_title || r.label || 'BREAK')}</td>
            </tr>
          `;
        } else {
          fullHtml += `
            <tr>
              <td class="cell-time">${timeFormatted}</td>
              <td class="cell-mins">${esc(minsStr)}</td>
          `;

          for (const d of DAYS) {
            const cell = r.days ? r.days[d] : null;
            if (cell && (cell.occupied || cell.is_class)) {
              const color = cell.color || { bg: cell.bg || '#f1f5f9', border: cell.border || '#cbd5e1', text: cell.text || '#1e293b' };
              fullHtml += `
                <td class="cell-class" style="background:${color.bg}; border-color:${color.border}; color:${color.text};">
                  <div class="cell-class-inner" style="display:flex; flex-direction:column; gap:2px; padding:2px;">
                    <span class="cell-subject-sec" style="font-weight:900; font-size:12px; line-height:1.2;">${esc(cell.subject || cell.label)}</span>
                    <span class="cell-mod-badge" style="color:${color.text}; font-weight:700; font-size:10.5px; opacity:0.9; line-height:1.1;">${esc(cell.section_short || cell.section || '')}</span>
                    <span class="cell-time-duration-pill" style="font-size:9px; font-weight:700; opacity:0.85; margin-top:2px;">${esc(timeFormatted.split('<br>')[0])} · ${esc(minsStr)}</span>
                  </div>
                </td>
              `;
            } else {
              fullHtml += `<td class="cell-empty"></td>`;
            }
          }

          fullHtml += `</tr>`;
        }
      });

      fullHtml += `
            </tbody>
          </table>
