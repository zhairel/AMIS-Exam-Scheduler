<html lang="en">

<style>
:root {
  --brand-deep: #064e3b;
  --brand-green: #0b4d38;
  --brand-accent: #0f766e;
  --brand-gold: #d97706;
  --brand-gold-light: #fef3c7;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --muted: #64748b;
  --line: #cbd5e1;
  --line-strong: #94a3b8;
  --bg: #f8fafc;
  --surface: #ffffff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

/* Top Toolbar */
.top-toolbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: var(--brand-deep);
  color: #fff;
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: contain;
  background: #ffffff;
  padding: 1px;
}

.brand-text h1 {
  font-size: 16px;
  font-weight: 900;
  letter-spacing: -0.01em;
}

.brand-text p {
  font-size: 12px;
  color: #a7f3d0;
  font-weight: 600;
}

.toolbar-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.select-teacher {
  background: #ffffff;
  color: var(--ink);
  border: 1.5px solid #a7f3d0;
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  min-width: 240px;
}

.select-teacher:focus {
  border-color: #34d399;
  box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.3);
}

.btn-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--brand-accent);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 12.5px;
  font-weight: 750;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-action:hover {
  background: #115e59;
  transform: translateY(-1px);
}

.btn-print {
  background: #f59e0b;
  color: #78350f;
  font-weight: 850;
  border-color: #d97706;
}

.btn-print:hover {
  background: #d97706;
  color: #fff;
}

.btn-back {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.3);
}

.btn-back:hover {
  background: rgba(255, 255, 255, 0.25);
}

/* Main Container */
.page-sheet-container {
  max-width: 1440px;
  margin: 24px auto;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 36px;
}

/* Individual Printable Sheet (A4 Landscape Formatted) */
.timetable-sheet {
  background: #ffffff;
  border: 1.5px solid #cbd5e1;
  border-radius: 12px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
  padding: 24px 28px;
  position: relative;
  page-break-after: always;
  break-after: page;
}

.school-header {
  text-align: center;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
  margin-bottom: 12px;
}

.school-header h1 {
  font-size: 20px;
  font-weight: 900;
  color: var(--brand-deep);
  letter-spacing: 0.02em;
  margin-bottom: 2px;
}

.school-header h2 {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.01em;
  margin-bottom: 3px;
}

.school-header p {
  font-size: 11px;
  font-weight: 650;
  color: var(--muted);
}

.teacher-banner {
  background: #f0fdf4;
  border-left: 5px solid var(--brand-deep);
  border-radius: 6px;
  padding: 8px 14px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.teacher-name-title {
  font-size: 17px;
  font-weight: 900;
  color: var(--brand-deep);
}

.teacher-meta-tag {
  font-size: 11.5px;
  font-weight: 800;
  background: #ffffff;
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 20px;
  color: var(--ink-secondary);
}

.btn-fullscreen {
  background: #ffffff;
  color: var(--brand-deep);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}

.btn-fullscreen:hover {
  background: #f0fdf4;
  transform: scale(1.05);
}

.btn-fullscreen svg {
  width: 15px;
  height: 15px;
  fill: currentColor;
}

.timetable-sheet.is-fullscreen {
  position: fixed !important;
  inset: 0 !important;
  z-index: 99999 !important;
  max-width: 100% !important;
  height: 100vh !important;
  margin: 0 !important;
  padding: 20px 24px !important;
  background: #ffffff !important;
  overflow-y: auto !important;
  border-radius: 0 !important;
  box-sizing: border-box !important;
}

/* 4-Day Grouped Grid */
.exam-date-groups-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.exam-date-group-column {
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  background: #ffffff;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.exam-date-group-header {
  background: var(--brand-deep);
  color: #ffffff;
  padding: 10px 8px;
  text-align: center;
  border-bottom: 2px solid #043828;
}

.header-day-badge {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #a7f3d0;
  margin-bottom: 2px;
}

.header-date-title {
  font-size: 13.5px;
  font-weight: 900;
  letter-spacing: -0.01em;
}

.header-weekday-sub {
  font-size: 11px;
  font-weight: 700;
  opacity: 0.9;
}

.exam-date-group-body {
  padding: 10px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #f8fafc;
}

/* Exam Assignment Card */
.assignment-card {
  background: #ffffff;
  border: 1.5px solid #cbd5e1;
  border-radius: 8px;
  padding: 10px 12px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.04);
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: transform 0.1s ease;
}

.assignment-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 6px;
}

.assignment-subject {
  font-size: 13px;
  font-weight: 900;
  line-height: 1.2;
}

.assignment-grade-sec {
  font-size: 11px;
  font-weight: 800;
  color: var(--brand-deep);
  line-height: 1.25;
}

.assignment-section-full {
  font-size: 10.5px;
  font-weight: 700;
  color: #475569;
  line-height: 1.2;
}

.assignment-date-badge {
  font-size: 10px;
  font-weight: 800;
  color: #0369a1;
  background: #e0f2fe;
  padding: 2px 6px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  width: fit-content;
}

.assignment-time-badge {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  padding: 4px 7px;
  font-size: 11px;
  font-weight: 850;
  color: #1e293b;
  margin-top: 1px;
}

.dur-pill {
  background: var(--brand-deep);
  color: #ffffff;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 9.5px;
  font-weight: 900;
}

.dur-pill-hsmath {
  background: #b91c1c;
  color: #ffffff;
}

.assignment-footer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 2px;
  padding-top: 4px;
  border-top: 1px solid #e2e8f0;
}

.modality-shift-tag {
  font-size: 9.5px;
  font-weight: 800;
  color: #475569;
  text-transform: uppercase;
}

.proctor-tag {
  font-size: 9.5px;
  font-weight: 800;
  color: #047857;
  background: #d1fae5;
  padding: 2px 6px;
  border-radius: 4px;
}

.gender-badge {
  font-size: 8.5px;
  font-weight: 850;
  padding: 1px 5px;
  border-radius: 3px;
  text-transform: uppercase;
}
.gender-boys { background: #dbeafe; color: #1e40af; }
.gender-girls { background: #fce7f3; color: #9d174d; }
.gender-mixed { background: #f3e8ff; color: #6b21a8; }

.conflict-alert-badge {
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #f87171;
  padding: 2px 5px;
  border-radius: 4px;
  font-weight: 900;
  font-size: 9px;
  margin-bottom: 3px;
  text-transform: uppercase;
}

.no-exams-day {
  padding: 30px 10px;
  text-align: center;
  color: #94a3b8;
  font-size: 11px;
  font-weight: 700;
}

/* Footer of Sheet */
.sheet-footer {
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1.5px solid #cbd5e1;
  padding-top: 8px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted);
}

/* Strict A4 Landscape Print Engine */

  .page-sheet-container {

  .timetable-sheet {

  .teacher-name-title { font-size: 13.5px !important; }

  .exam-date-groups-grid {

  .exam-date-group-header { padding: 4px 4px !important; }

</style>

<script>
(function() {
  // Exact 4 Exam Days (Sep 2, Sep 3, Sep 6, Sep 7)
  const EXAM_DAYS = [
    {
      day_num: 1,
      day_label: "1st Exam Day",
      full_date: "September 2, 2026",
      weekday: "Wednesday",
      short_date: "Sep 2"
    },
    {
      day_num: 2,
      day_label: "2nd Exam Day",
      full_date: "September 3, 2026",
      weekday: "Thursday",
      short_date: "Sep 3"
    },
    {
      day_num: 3,
      day_label: "3rd Exam Day",
      full_date: "September 6, 2026",
      weekday: "Sunday",
      short_date: "Sep 6"
    },
    {
      day_num: 4,
      day_label: "4th Exam Day",
      full_date: "September 7, 2026",
      weekday: "Monday",
      short_date: "Sep 7"
    }
  ];

  const GRADE_ORDER = {
    "Kinder 1": 1, "K1": 1,
    "Kinder 2": 2, "K2": 2,
    "Grade 1": 3, "Grade 2": 4, "Grade 3": 5, "Grade 4": 6,
    "Grade 5": 7, "Grade 6": 8, "Grade 7": 9, "Grade 8": 10,
    "Grade 9": 11, "Grade 10": 12, "Grade 11": 13, "Grade 12": 14
  };

  let ALL_EXAM_RECORDS = [];
  let TEACHER_NAMES = [];

  function cleanSecName(s) {
    if (!s) return '';
    return s.replace(/^GRADE\s*\d+\s*-\s*/i, '')
            .replace(/^KINDER\s*\d*\s*/i, '')
            .replace(/^K\d+\s*-\s*/i, '')
            .replace(/\s*\((?:1ST|2ND)\s+SHIFT\)/i, '')
            .replace(/\s*-\s*(?:BOYS|GIRLS|MIX|MIXED)/i, '')
            .trim();
  }

  function minutes(tStr) {
    if (!tStr) return 0;
    const parts = tStr.trim().split(' ');
    if (parts.length < 2) return 0;
    const hm = parts[0].split(':');
    let h = parseInt(hm[0], 10);
    let m = parseInt(hm[1], 10) || 0;
    const ampm = parts[1].toUpperCase();
    if (ampm === 'PM' && h !== 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;
    return h * 60 + m;
  }

  function calcDuration(tStr, fallback) {
    if (!tStr) return fallback || 60;
    const parts = tStr.split(/[-–]/);
    if (parts.length >= 2) {
      const m1 = minutes(parts[0].trim());
      const m2 = minutes(parts[1].trim());
      let diff = m2 - m1;
      if (diff < 0) diff += 24 * 60;
      if (diff > 0) return diff;
    }
    if (typeof fallback === 'number' && fallback > 0) return fallback;
    return 60;
  }

  function getSubjectColor(subj) {
    const s = (subj || '').toLowerCase();
    if (s.includes('arabic') || s.includes("qur'an") || s.includes('hadith') || s.includes('shaf')) {
      return { bg: '#f3e8ff', border: '#d8b4fe', text: '#581c87' };
    }
    if (s.includes('math') || s.includes('calculus') || s.includes('algebra') || s.includes('stat')) {
      return { bg: '#e0f2fe', border: '#7dd3fc', text: '#0369a1' };
    }
    if (s.includes('sci') || s.includes('biology') || s.includes('chem') || s.includes('phys')) {
      return { bg: '#ccfbf1', border: '#5eead4', text: '#115e59' };
    }
    if (s.includes('english') || s.includes('reading') || s.includes('oral') || s.includes('eapp')) {
      return { bg: '#fef3c7', border: '#fde047', text: '#854d0e' };
    }
    if (s.includes('filipino') || s.includes('makabansa') || s.includes('ap') || s.includes('panlipunan')) {
      return { bg: '#ffedd5', border: '#fdba74', text: '#9a3412' };
    }
    if (s.includes('gmrc') || s.includes('values') || s.includes('esp')) {
      return { bg: '#dcfce7', border: '#86efac', text: '#14532d' };
    }
    return { bg: '#f1f5f9', border: '#cbd5e1', text: '#1e293b' };
  }

  function init() {
    if (typeof AMIS_EXAM_DATA !== 'undefined') {
      ALL_EXAM_RECORDS = AMIS_EXAM_DATA;
      processData();
    } else {
      fetch('exam_data.json')
        .then(r => r.json())
        .then(data => {
          ALL_EXAM_RECORDS = data;
          processData();
        })
        .catch(err => {
          document.getElementById('sheetsContainer').innerHTML = `
            <div style="padding:40px; text-align:center; color:#b91c1c; font-weight:800;">
              Failed to load exam schedule dataset.
            </div>
          `;
        });
    }

    document.getElementById('teacherPicker').addEventListener('change', function(e) {
      const val = e.target.value;
      const url = new URL(window.location);
      if (val === 'ALL_FACULTY') {
        url.searchParams.delete('teacher');
      } else {
        url.searchParams.set('teacher', val);
      }
      window.history.pushState({}, '', url);
      renderSelectedTeachers(val);
    });

    document.getElementById('btnPrint').addEventListener('click', function() {
      window.print();
    });
  }

  function processData() {
    TEACHER_NAMES = [...new Set(ALL_EXAM_RECORDS.map(r => r.teacher))]
      .filter(Boolean)
      .sort((a, b) => a.localeCompare(b));

    populateTeacherDropdown();
    handleInitialRoute();
  }

  function populateTeacherDropdown() {
    const picker = document.getElementById('teacherPicker');
    picker.innerHTML = '<option value="ALL_FACULTY">All Staff / Faculty (Print All)</option>';

    TEACHER_NAMES.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      const count = ALL_EXAM_RECORDS.filter(r => r.teacher === name).length;
      opt.textContent = `${name} (${count} exams)`;
      picker.appendChild(opt);
    });
  }

  function handleInitialRoute() {
    const params = new URLSearchParams(window.location.search);
    const teacherParam = params.get('teacher');

    if (teacherParam && TEACHER_NAMES.includes(teacherParam)) {
      document.getElementById('teacherPicker').value = teacherParam;
      renderSelectedTeachers(teacherParam);
    } else {
      const firstT = TEACHER_NAMES[0];
      if (firstT) {
        document.getElementById('teacherPicker').value = firstT;
        renderSelectedTeachers(firstT);
      } else {
        renderSelectedTeachers('ALL_FACULTY');
      }
    }
  }

  function renderSelectedTeachers(val) {
    if (val === 'ALL_FACULTY') {
      renderMultipleTeacherSheets(TEACHER_NAMES);
    } else {
      renderMultipleTeacherSheets([val]);
    }
  }

  function renderMultipleTeacherSheets(names) {
    const todayStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    let fullHtml = '';

    names.forEach(teacherName => {
      const tExams = ALL_EXAM_RECORDS.filter(r => r.teacher === teacherName);
      const totalCount = tExams.length;
      const subjsList = [...new Set(tExams.map(r => r.subject))].join(', ') || 'Examination Proctoring';
      const metaStr = `${totalCount} Exam Session${totalCount === 1 ? '' : 's'} • ${subjsList}`;

      fullHtml += `
        <div class="timetable-sheet">
          <div class="school-header" style="display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;">
            <img src="amis_logo.png" alt="AMIS Logo" style="width:48px; height:48px; border-radius:50%; object-fit:contain;">
            <div>
              <h1 style="margin:0;">AL MUNAWWARA ISLAMIC SCHOOL</h1>
              <h2 style="margin:2px 0 0 0;">Faculty Timetable — Exam Schedule</h2>
              <p style="margin:2px 0 0 0;">Dates: Sep 2, 3, 6 & 7, 2026 • 1st Term Examination S.Y. 2026–2027 • Developed by Software Engineer Mon Zhairel Lingasa</p>
            </div>
          </div>

          <div class="teacher-banner">
            <span class="teacher-name-title">${esc(teacherName.toUpperCase())}</span>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="teacher-meta-tag">${esc(metaStr)}</span>
              <button class="btn-fullscreen" onclick="toggleFullscreenSheet(this)" title="Fullscreen Table" aria-label="Toggle Fullscreen">
                <svg class="icon-expand" viewBox="0 0 24 24" style="display:inline-block;"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                <svg class="icon-compress" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
              </button>
            </div>
          </div>

          <div class="exam-date-groups-grid">
      `;

      EXAM_DAYS.forEach(day => {
        // Filter and sort assignments by: 1. Start Time, 2. Grade, 3. Section
        const dayExams = tExams
          .filter(r => r.day_number === day.day_num)
          .sort((a, b) => {
            const tA = minutes(a.time_slot || a.time);
            const tB = minutes(b.time_slot || b.time);
            if (tA !== tB) return tA - tB;
            const gA = GRADE_ORDER[a.grade] || 99;
            const gB = GRADE_ORDER[b.grade] || 99;
            if (gA !== gB) return gA - gB;
            return (a.section_name || a.section || '').localeCompare(b.section_name || b.section || '');
          });

        fullHtml += `
          <div class="exam-date-group-column">
            <div class="exam-date-group-header">
              <div class="header-day-badge">${day.day_label}</div>
              <div class="header-date-title">${day.full_date}</div>
              <div class="header-weekday-sub">${day.weekday}</div>
            </div>
            <div class="exam-date-group-body">
        `;

        if (dayExams.length === 0) {
          fullHtml += `
            <div class="no-exams-day">
              No exam sessions scheduled for ${day.full_date}
            </div>
          `;
        } else {
          dayExams.forEach((ex, idx) => {
            const timeStr = ex.time_slot || ex.time || '';
            const dur = calcDuration(timeStr, ex.duration_minutes);
            const color = getSubjectColor(ex.subject);
            const shiftLabel = ex.modality === 'F2F' ? 'F2F Classroom' : (ex.shift && ex.shift.includes('2nd') ? 'ODL 2nd Shift' : 'ODL 1st Shift');
            const isHsMath = (ex.grade && ex.grade.includes('Grade') && parseInt(ex.grade.replace(/\D/g, ''), 10) >= 7 && ex.subject && (ex.subject.toLowerCase().includes('math') || ex.subject.toLowerCase().includes('calculus') || ex.subject.toLowerCase().includes('stat')));
            
            // Check for conflict on the same day
            const hasConflict = dayExams.some((other, oIdx) => {
              if (oIdx === idx) return false;
              const oTime = other.time_slot || other.time || '';
              return oTime === timeStr;
            });

            // Gender badge logic: only display if explicitly BOYS, GIRLS, or MIXED (hide if unknown)
            const rawGender = (ex.gender || '').toUpperCase().trim();
            let genderBadgeHtml = '';
            if (rawGender === 'BOYS') {
              genderBadgeHtml = `<span class="gender-badge gender-boys">Boys</span>`;
            } else if (rawGender === 'GIRLS') {
              genderBadgeHtml = `<span class="gender-badge gender-girls">Girls</span>`;
            } else if (rawGender === 'MIXED') {
              genderBadgeHtml = `<span class="gender-badge gender-mixed">Mixed</span>`;
            }

            fullHtml += `
              <div class="assignment-card" style="border-left: 4px solid ${color.border};">
                ${hasConflict ? `<div class="conflict-alert-badge">⚠️ TEACHER SCHEDULE CONFLICT</div>` : ''}
                
                <div class="assignment-card-header">
                  <span class="assignment-subject" style="color: ${color.text};">${esc(ex.subject)}</span>
                  ${genderBadgeHtml}
                </div>

                <div class="assignment-grade-sec">
                  ${esc(ex.grade)}
                </div>
                <div class="assignment-section-full">
                  ${esc(ex.section_name || ex.section || '')}
                </div>

                <div class="assignment-date-badge">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V8H19M16 1V3H8V1H6V3H5C3.89 3 3 3.89 3 5V19A2 2 0 0 0 5 21H19A2 2 0 0 0 21 19V5C21 3.89 20.1 3 19 3H18V1M17 12H12V17H17V12Z"/></svg>
                  ${day.full_date}
                </div>

                <div class="assignment-time-badge">
                  <span>${esc(timeStr)}</span>
                  <span class="dur-pill ${isHsMath ? 'dur-pill-hsmath' : ''}">${dur} mins</span>
                </div>

                <div class="assignment-footer-row">
                  <span class="modality-shift-tag">${esc(shiftLabel)}</span>
                  <span class="proctor-tag">Proctor: ${esc(teacherName)}</span>
                </div>
              </div>
            `;
          });
        }

        fullHtml += `
            </div>
          </div>
        `;
      });

      fullHtml += `
          </div>

          <div class="sheet-footer">
            <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
              <span>• Exam Dates: <strong>Sep 2, 3, 6 & 7, 2026</strong></span>
              <span>• High School Math: <strong>120 mins (2 Hours)</strong></span>
              <span>• Elementary & HS Normal Subjects: <strong>60 mins</strong></span>
              <span>• Qur'an Proctor: <strong>Assigned Section Qur'an Teacher</strong></span>
            </div>
            <div>
              Generated: <strong>${todayStr}</strong>
            </div>
          </div>
        </div>
      `;
    });

    document.getElementById('sheetsContainer').innerHTML = fullHtml;
  }

  window.toggleFullscreenSheet = function(btn) {
    const sheet = btn.closest('.timetable-sheet');
    if (!sheet) return;

    const isFs = sheet.classList.toggle('is-fullscreen');
    const iconExpand = btn.querySelector('.icon-expand');
    const iconCompress = btn.querySelector('.icon-compress');

    if (isFs) {
      if (iconExpand) iconExpand.style.display = 'none';
      if (iconCompress) iconCompress.style.display = 'inline-block';
      btn.setAttribute('title', 'Exit Fullscreen');
      if (sheet.requestFullscreen && !document.fullscreenElement) {
        sheet.requestFullscreen().catch(() => {});
      }
    } else {
      if (iconExpand) iconExpand.style.display = 'inline-block';
      if (iconCompress) iconCompress.style.display = 'none';
      btn.setAttribute('title', 'Fullscreen Table');
      if (document.exitFullscreen && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }
  };

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      document.querySelectorAll('.timetable-sheet.is-fullscreen').forEach(sh => {
        sh.classList.remove('is-fullscreen');
        const btn = sh.querySelector('.btn-fullscreen');
        if (btn) {
          const iconExpand = btn.querySelector('.icon-expand');
          const iconCompress = btn.querySelector('.icon-compress');
          if (iconExpand) iconExpand.style.display = 'inline-block';
          if (iconCompress) iconCompress.style.display = 'none';
          btn.setAttribute('title', 'Fullscreen Table');
        }
      });
    }
  });

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

</body>
</html>
